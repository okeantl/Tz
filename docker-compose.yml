services:

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    env_file:
      - .env

  migrations:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully

  outbox-relay:
    build: .
    command: python -m src.worker.outbox_relay
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    build: .
    command: python -m src.worker.payment_consumer
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  webhook-mock:
    build: .
    command: uvicorn src.webhook_mock:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"

volumes:
  db-data:
